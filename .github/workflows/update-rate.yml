name: update-rate
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-rate
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_rate.py
      - name: commit
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rate.json
          git diff --cached --quiet || (git commit -m "update rate" && git push)
